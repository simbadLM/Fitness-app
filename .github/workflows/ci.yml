name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dépendances
        run: flutter pub get

      - name: Analyse statique
        run: flutter analyze

      - name: Tests unitaires
        run: flutter test

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Publier l'APK en artefact
        uses: actions/upload-artifact@v4
        with:
          name: fitness-game-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dépendances
        run: flutter pub get

      - name: Build iOS (release, non signé)
        run: flutter build ios --release --no-codesign

      - name: Empaqueter en IPA non signé
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -qry fitness-game-unsigned.ipa Payload

      - name: Publier l'IPA en artefact
        uses: actions/upload-artifact@v4
        with:
          name: fitness-game-ios-unsigned-ipa
          path: fitness-game-unsigned.ipa
